schema: 1

profile:
  id: nano
  title: ENDWORLD NANO
  target_bytes: 62000000000
  reserve_bytes: 10000000000
  acquisition_headroom_bytes: 2500000000
  root_partition_mib: 8192
  description: >
    A portable offline node that prioritizes Spanish knowledge, medicine,
    local AI, maps, resilient communications and Android recovery apps.

runtime:
  portal_port: 8080
  kiwix_port: 8081
  ai_port: 8082
  whisper_port: 8083

prepare:
  maps:
    - id: spain-pmtiles
      source_artifact: spain-osm
      filename: spain.pmtiles

artifacts:
  - id: wikipedia-es
    family: knowledge
    kind: index_latest
    required: true
    index_url: https://download.kiwix.org/zim/wikipedia/
    href_regex: 'wikipedia_es_all_maxi_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 42000000000

  - id: wikipedia-medicine-es
    family: medical
    kind: index_latest
    required: true
    index_url: https://download.kiwix.org/zim/wikipedia/
    href_regex: 'wikipedia_es_medicine_maxi_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 1000000000

  - id: wikisource-es
    family: knowledge
    kind: index_latest
    required: false
    index_url: https://download.kiwix.org/zim/wikisource/
    href_regex: 'wikisource_es_all_nopic_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 1200000000

  - id: qwen3-4b-q4
    family: ai
    kind: url
    required: true
    url: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true
    filename: Qwen3-4B-Q4_K_M.gguf
    destination: ai/models
    budget_bytes: 3000000000

  - id: whisper-small
    family: ai
    kind: url
    required: true
    url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin?download=true
    filename: ggml-small.bin
    destination: ai/models
    budget_bytes: 700000000

  - id: whisper-cpp-source
    family: ai
    kind: github_snapshot
    required: true
    repo: ggml-org/whisper.cpp
    ref: latest-release
    destination: source/ai
    budget_bytes: 150000000

  - id: spain-osm
    family: maps
    kind: index_latest
    required: true
    index_url: https://download.geofabrik.de/europe/spain.html
    href_regex: 'spain-[0-9]{6}\.osm\.pbf'
    destination: maps/raw
    budget_bytes: 6000000000

  - id: bitchat-android
    family: comms
    kind: github_release_asset
    required: true
    repo: permissionlesstech/bitchat-android
    asset_regex: 'bitchat-android-universal\.apk'
    checksum_asset_regex: 'BITCHAT_SHA256SUMS'
    destination: apps/android
    budget_bytes: 300000000

  - id: meshtastic-android
    family: comms
    kind: github_release_asset
    required: true
    repo: meshtastic/Meshtastic-Android
    asset_regex: 'androidApp-fdroid-universal-release\.apk'
    destination: apps/android
    budget_bytes: 500000000

  - id: organicmaps-android
    family: maps
    kind: github_release_asset
    required: false
    repo: organicmaps/organicmaps
    asset_regex: 'OrganicMaps-.*-web-release\.apk'
    checksum_asset_regex: 'OrganicMaps-.*-web-release\.apk\.sha256sum'
    destination: apps/android
    budget_bytes: 500000000

  - id: meshtastic-firmware
    family: comms
    kind: github_release_asset
    required: false
    repo: meshtastic/firmware
    asset_regex: 'firmware-esp32-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 1000000000

  - id: meshtastic-firmware-esp32c3
    family: comms
    kind: github_release_asset
    required: false
    repo: meshtastic/firmware
    asset_regex: 'firmware-esp32c3-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 50000000

  - id: meshtastic-firmware-esp32c6
    family: comms
    kind: github_release_asset
    required: false
    repo: meshtastic/firmware
    asset_regex: 'firmware-esp32c6-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 50000000

  - id: meshtastic-firmware-esp32s3
    family: comms
    kind: github_release_asset
    required: false
    repo: meshtastic/firmware
    asset_regex: 'firmware-esp32s3-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 300000000

  - id: meshtastic-firmware-nrf52840
    family: comms
    kind: github_release_asset
    required: false
    repo: meshtastic/firmware
    asset_regex: 'firmware-nrf52840-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 100000000

  - id: meshtastic-firmware-rp2040
    family: comms
    kind: github_release_asset
    required: false
    repo: meshtastic/firmware
    asset_regex: 'firmware-rp2040-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 30000000

  - id: meshtastic-firmware-rp2350
    family: comms
    kind: github_release_asset
    required: false
    repo: meshtastic/firmware
    asset_regex: 'firmware-rp2350-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 30000000

  - id: meshtastic-firmware-stm32
    family: comms
    kind: github_release_asset
    required: false
    repo: meshtastic/firmware
    asset_regex: 'firmware-stm32-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 30000000

  - id: sideband-android
    family: comms
    kind: github_release_asset
    required: true
    repo: markqvist/Sideband
    asset_regex: 'Sideband_[0-9.]+\.apk'
    destination: apps/android
    budget_bytes: 300000000

  - id: lxmf-source
    family: comms
    kind: github_snapshot
    required: true
    repo: markqvist/LXMF
    ref: latest-release
    destination: source/comms
    budget_bytes: 200000000
    license_review: upstream-lxmf-license

  - id: nomadnet-source
    family: comms
    kind: github_snapshot
    required: false
    repo: markqvist/NomadNet
    ref: latest-release
    destination: source/comms
    budget_bytes: 100000000
    license_review: upstream-nomadnet-license

  - id: reticulum-source
    family: comms
    kind: github_snapshot
    required: true
    repo: markqvist/Reticulum
    ref: latest-release
    destination: source/comms
    budget_bytes: 500000000
    license_review: upstream-reticulum-license

  - id: project-nomad-source
    family: core
    kind: github_snapshot
    required: true
    repo: Crosstalk-Solutions/project-nomad
    ref: latest-release
    destination: source/core
    budget_bytes: 1000000000

  - id: planetiler
    family: maps
    kind: url
    required: true
    url: https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
    checksum_url: https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar.sha256
    filename: planetiler.jar
    destination: tools/planetiler
    budget_bytes: 120000000

  - id: planetiler-water-polygons
    family: maps
    kind: url
    required: true
    url: https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
    filename: water-polygons-split-3857.zip
    destination: tools/planetiler/sources
    budget_bytes: 1000000000

  - id: planetiler-natural-earth
    family: maps
    kind: url
    required: true
    url: https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
    filename: natural_earth_vector.sqlite.zip
    destination: tools/planetiler/sources
    budget_bytes: 600000000

  - id: planetiler-lake-centerlines
    family: maps
    kind: url
    required: true
    url: https://github.com/lukasmartinelli/osm-lakelines/releases/download/v0.9/lake_centerline.shp.zip
    filename: lake_centerline.shp.zip
    destination: tools/planetiler/sources
    budget_bytes: 100000000

  - id: maplibre-js
    family: runtime
    kind: url
    required: true
    url: https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js
    filename: maplibre-gl.js
    destination: web/vendor
    budget_bytes: 5000000

  - id: maplibre-css
    family: runtime
    kind: url
    required: true
    url: https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css
    filename: maplibre-gl.css
    destination: web/vendor
    budget_bytes: 1000000

  - id: pmtiles-js
    family: runtime
    kind: url
    required: true
    url: https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js
    filename: pmtiles.js
    destination: web/vendor
    budget_bytes: 1000000

containers:
  - id: kiwix
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    required: true

  - id: llama-server
    image: ghcr.io/ggml-org/llama.cpp:server
    required: true


policy:
  fail_if_required_missing: true
  skip_optional_if_over_budget: true
  preserve_previous_lock: true
  no_execute_downloaded_artifacts: true
  immutable_field_node: true
