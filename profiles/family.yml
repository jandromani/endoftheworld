schema: 1

profile:
  id: family
  title: ENDWORLD FAMILY
  target_bytes: 256000000000
  reserve_bytes: 24000000000
  acquisition_headroom_bytes: 20000000000
  root_partition_mib: 12288
  description: >
    A household-scale offline node for months of disconnected operation:
    bilingual knowledge, medical references, stronger local AI, Iberian maps,
    resilient communications, family replication and a local software forge.

runtime:
  portal_port: 8080
  kiwix_port: 8081
  ai_port: 8082
  whisper_port: 8083
  forgejo_port: 3000
  syncthing_port: 8384

prepare:
  maps:
    - id: spain-pmtiles
      source_artifact: spain-osm
      filename: spain.pmtiles
    - id: portugal-pmtiles
      source_artifact: portugal-osm
      filename: portugal.pmtiles

artifacts:
  - id: wikipedia-es
    family: knowledge
    kind: index_latest
    required: true
    index_url: https://download.kiwix.org/zim/wikipedia/
    href_regex: 'wikipedia_es_all_maxi_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 45000000000

  - id: wikipedia-en-nopic
    family: knowledge
    kind: index_latest
    required: true
    index_url: https://download.kiwix.org/zim/wikipedia/
    href_regex: 'wikipedia_en_all_nopic_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 70000000000

  - id: wikipedia-medicine-es
    family: medical
    kind: index_latest
    required: true
    index_url: https://download.kiwix.org/zim/wikipedia/
    href_regex: 'wikipedia_es_medicine_maxi_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 1500000000

  - id: wikisource-es
    family: knowledge
    kind: index_latest
    required: true
    index_url: https://download.kiwix.org/zim/wikisource/
    href_regex: 'wikisource_es_all_nopic_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 2000000000

  - id: wikivoyage-es
    family: knowledge
    kind: index_latest
    required: false
    index_url: https://download.kiwix.org/zim/wikivoyage/
    href_regex: 'wikivoyage_es_all_maxi_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 2000000000

  - id: wikibooks-es
    family: knowledge
    kind: index_latest
    required: false
    index_url: https://download.kiwix.org/zim/wikibooks/
    href_regex: 'wikibooks_es_all_maxi_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 3000000000

  - id: gutenberg-es
    family: knowledge
    kind: index_latest
    required: false
    index_url: https://download.kiwix.org/zim/gutenberg/
    href_regex: 'gutenberg_es_all_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 6000000000

  - id: stackoverflow-en
    family: technical
    kind: index_latest
    required: false
    index_url: https://download.kiwix.org/zim/stack_exchange/
    href_regex: 'stackoverflow.com_en_all_[0-9]{4}-[0-9]{2}\.zim'
    destination: knowledge/zim
    budget_bytes: 85000000000

  - id: qwen3-8b-q4
    family: ai
    kind: url
    required: true
    url: https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf?download=true
    filename: Qwen3-8B-Q4_K_M.gguf
    destination: ai/models
    budget_bytes: 6000000000

  - id: whisper-medium
    family: ai
    kind: url
    required: true
    url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.bin?download=true
    filename: ggml-medium.bin
    destination: ai/models
    budget_bytes: 2000000000

  - id: spain-osm
    family: maps
    kind: index_latest
    required: true
    index_url: https://download.geofabrik.de/europe/spain.html
    href_regex: 'spain-[0-9]{6}\.osm\.pbf'
    destination: maps/raw
    budget_bytes: 6000000000

  - id: portugal-osm
    family: maps
    kind: index_latest
    required: true
    index_url: https://download.geofabrik.de/europe/portugal.html
    href_regex: 'portugal-[0-9]{6}\.osm\.pbf'
    destination: maps/raw
    budget_bytes: 3000000000

  - id: bitchat-android
    family: comms
    kind: github_release_asset
    required: true
    repo: permissionlesstech/bitchat-android
    asset_regex: 'bitchat-android-universal\.apk'
    checksum_asset_regex: 'BITCHAT_SHA256SUMS'
    destination: apps/android
    budget_bytes: 300000000

  - id: meshtastic-android
    family: comms
    kind: github_release_asset
    required: true
    repo: meshtastic/Meshtastic-Android
    asset_regex: 'androidApp-fdroid-universal-release\.apk'
    destination: apps/android
    budget_bytes: 500000000

  - id: organicmaps-android
    family: maps
    kind: github_release_asset
    required: true
    repo: organicmaps/organicmaps
    asset_regex: 'OrganicMaps-.*-web-release\.apk'
    checksum_asset_regex: 'OrganicMaps-.*-web-release\.apk\.sha256sum'
    destination: apps/android
    budget_bytes: 500000000

  - id: meshtastic-firmware
    family: comms
    kind: github_release_asset
    required: true
    repo: meshtastic/firmware
    asset_regex: 'firmware-esp32-[0-9A-Za-z._-]+\.zip'
    destination: firmware/meshtastic
    budget_bytes: 1000000000

  - id: reticulum-source
    family: comms
    kind: github_snapshot
    required: true
    repo: markqvist/Reticulum
    ref: latest-release
    destination: source/comms
    budget_bytes: 500000000

  - id: project-nomad-source
    family: core
    kind: github_snapshot
    required: true
    repo: Crosstalk-Solutions/project-nomad
    ref: latest-release
    destination: source/core
    budget_bytes: 1000000000

  - id: syncthing-source
    family: replication
    kind: github_snapshot
    required: true
    repo: syncthing/syncthing
    ref: latest-release
    destination: source/replication
    budget_bytes: 1000000000

  - id: forgejo-source
    family: software-vault
    kind: github_snapshot
    required: true
    repo: forgejo/forgejo
    ref: latest-release
    destination: source/software
    budget_bytes: 2000000000

  - id: free-programming-books-source
    family: technical
    kind: github_snapshot
    required: false
    repo: EbookFoundation/free-programming-books
    ref: default
    destination: source/knowledge
    budget_bytes: 1000000000

  - id: planetiler
    family: maps
    kind: url
    required: true
    url: https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
    checksum_url: https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar.sha256
    filename: planetiler.jar
    destination: tools/planetiler
    budget_bytes: 120000000

  - id: maplibre-js
    family: runtime
    kind: url
    required: true
    url: https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js
    filename: maplibre-gl.js
    destination: web/vendor
    budget_bytes: 5000000

  - id: maplibre-css
    family: runtime
    kind: url
    required: true
    url: https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css
    filename: maplibre-gl.css
    destination: web/vendor
    budget_bytes: 1000000

  - id: pmtiles-js
    family: runtime
    kind: url
    required: true
    url: https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js
    filename: pmtiles.js
    destination: web/vendor
    budget_bytes: 1000000

containers:
  - id: kiwix
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    required: true
  - id: llama-server
    image: ghcr.io/ggml-org/llama.cpp:server
    required: true
  - id: whisper-server
    image: ghcr.io/ggml-org/whisper.cpp:main
    required: true
  - id: syncthing
    image: ghcr.io/syncthing/syncthing:2.1.5
    required: true
  - id: forgejo
    image: codeberg.org/forgejo/forgejo:15.0.9
    required: true

policy:
  fail_if_required_missing: true
  skip_optional_if_over_budget: true
  preserve_previous_lock: true
  no_execute_downloaded_artifacts: true
  immutable_field_node: true
