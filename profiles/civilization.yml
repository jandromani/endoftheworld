schema: 1
profile:
  id: civilization
  title: THE ARK CIVILIZATION
  target_bytes: 4000000000000
  reserve_bytes: 700000000000
  acquisition_headroom_bytes: 400000000000
  root_partition_mib: 65536
  description: >
    Four-terabyte reconstruction node: everything in NOMAD plus continental
    maps, science/engineering/CAD source ecosystems and build-time package
    snapshots designed to preserve dependency closure for practical rebuilding.
runtime:
  portal_port: 8080
  kiwix_port: 8081
  ai_port: 8082
  whisper_port: 8083
  forgejo_port: 3000
  qdrant_port: 6333
  syncthing_port: 8384
  code_server_port: 8443
  project_nomad_port: 8090
prepare:
