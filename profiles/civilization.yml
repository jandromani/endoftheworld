    - {id: portugal-pmtiles, source_artifact: portugal-osm, filename: portugal.pmtiles}
    - {id: france-pmtiles, source_artifact: france-osm, filename: france.pmtiles}
    - {id: europe-pmtiles, source_artifact: europe-osm, filename: europe.pmtiles}
