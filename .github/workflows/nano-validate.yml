name: Validate ENDWORLD NANO

on:
  push:
    paths:
      - "profiles/**"
      - "scripts/**"
      - "runtime/**"
      - "config/**"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/nano-validate.yml"
  pull_request:
    paths:
      - "profiles/**"
      - "scripts/**"
      - "runtime/**"
      - "config/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Compile every Python entrypoint
        run: python -m py_compile scripts/*.py runtime/server.py

      - name: Parse every shell entrypoint
        run: |
          for f in scripts/*.sh runtime/*.sh runtime/network/*.sh; do
            bash -n "$f"
          done

      - name: ShellCheck appliance scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x scripts/*.sh runtime/*.sh runtime/network/*.sh || true

      - name: ENDWORLD source self-test
        run: python scripts/endworld.py --profile nano selftest

      - name: Validate NANO manifest and budget
        run: |
          python - <<'PY'
          import pathlib, yaml
          p = yaml.safe_load(pathlib.Path("profiles/nano.yml").read_text())
          assert p["schema"] == 1
          meta = p["profile"]
          assert meta["id"] == "nano"
          assert int(meta["target_bytes"]) == 64_000_000_000
          assert 0 < int(meta["reserve_bytes"]) < int(meta["target_bytes"])
          assert int(meta["target_bytes"]) - int(meta["reserve_bytes"]) <= 52_000_000_000
          ids = [x["id"] for x in p["artifacts"]]
          assert len(ids) == len(set(ids)), "duplicate artifact ids"
          required = {"wikipedia-es","wikipedia-medicine-es","qwen3-4b-q4","whisper-small",
                      "spain-osm","planetiler","maplibre-js","maplibre-css","pmtiles-js",
                      "bitchat-android","meshtastic-android","reticulum-source","project-nomad-source"}
          assert required.issubset(ids), required-set(ids)
          print("NANO manifest OK")
          PY

      - name: Test ENDWORLD HTTP server and byte ranges
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/portal" "$tmp/vault/maps/tiles" "$tmp/vault/lock" "$tmp/vault/apps/android"
          printf '<h1>ENDWORLD TEST</h1>' > "$tmp/portal/index.html"
          python - <<PY
          from pathlib import Path
          Path("$tmp/vault/maps/tiles/spain.pmtiles").write_bytes(bytes(range(256))*4096)
          Path("$tmp/vault/lock/nano.lock.json").write_text('{"schema":1}')
          PY
          python runtime/server.py --bind 127.0.0.1 --port 18080 --portal "$tmp/portal" --vault "$tmp/vault" >"$tmp/server.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:18080/health && break || sleep .2; done
          curl -fsS http://127.0.0.1:18080/api/status >/dev/null
          code="$(curl -sS -o "$tmp/range.bin" -w '%{http_code}' -H 'Range: bytes=100-199' http://127.0.0.1:18080/maps/spain.pmtiles)"
          test "$code" = "206"
          test "$(stat -c %s "$tmp/range.bin")" = "100"

      - name: Required source resolution smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/acquire.py plan --profile profiles/nano.yml --vault vault/nano

      - name: CLI smoke test
        run: |
          python scripts/endworld.py --help >/dev/null
          python scripts/endworld.py --profile nano --help >/dev/null
