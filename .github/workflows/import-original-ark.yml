name: Import original THE ARK artwork
on:
  push:
    paths:
      - .github/workflows/import-original-ark.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontiers-8-11
      - name: Download exact original generated PNG
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          curl --fail --location --retry 3 --output docs/assets/the-ark-original.png 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9534-81f4-9342-af099f0b8db8/raw?se=2026-10-01T10%3A42%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=89fcadf7-9c41-503a-8016-65211064c5e0&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T10%3A14%3A33Z&ske=2026-10-02T10%3A14%3A33Z&sks=b&skv=2026-02-06&sig=YCvJT/5Md%2BpRMg634/Brr5Mc4gcEwNFgvQf%2BLnmOwIk%3D'
          test "$(stat -c %s docs/assets/the-ark-original.png)" = "3473322"
          echo "9e6805b526f167642325a1b6aa4aa669b41f649fca6cf032ac6cc33f0ec54787  docs/assets/the-ark-original.png" | sha256sum -c -
          file docs/assets/the-ark-original.png
      - name: Commit exact binary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/the-ark-original.png
          git diff --cached --quiet && exit 0
          git commit -m "Add exact original THE ARK artwork"
          git push origin HEAD:frontiers-8-11
