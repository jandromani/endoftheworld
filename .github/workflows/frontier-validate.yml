name: Validate THE ARK frontiers

on:
  push:
    paths:
      - "builder/**"
      - "profiles/**"
      - "scripts/**"
      - "runtime/**"
      - "manifests/**"
      - "config/**"
      - "hardware/**"
      - "field-reports/**"
      - "docs/hardware-matrix.md"
      - "docs/guides/**"
      - "Makefile"
      - ".github/workflows/frontier-validate.yml"
  pull_request:
    paths:
      - "builder/**"
      - "profiles/**"
      - "scripts/**"
      - "runtime/**"
      - "manifests/**"
      - "config/**"
      - "hardware/**"
      - "field-reports/**"
      - "docs/hardware-matrix.md"
      - "docs/guides/**"
      - "Makefile"
      - ".github/workflows/frontier-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Compile and parse
        run: |
          python -m py_compile scripts/*.py runtime/*.py builder/ark_builder.py
          for f in scripts/*.sh runtime/*.sh runtime/network/*.sh; do bash -n "$f"; done
          node --check builder/app.js
          node --check runtime/portal/app.js

      - name: Existing profile self-tests
        run: |
          python scripts/endworld.py --profile nano selftest
          python scripts/endworld.py --profile family selftest
          python scripts/endworld.py --profile nomad selftest
          python scripts/endworld.py --profile civilization selftest

      - name: Zero-touch contracts
        run: |
          python builder/ark_builder.py --check
          python scripts/first_boot_wizard.py --check

      - name: Seven package ecosystems
        run: |
          python scripts/snapshot_packages.py --profile profiles/civilization.yml --vault /tmp/no-vault --manifest manifests/civilization-packages.yml --dry-run > /tmp/packages.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/packages.json"))
          assert set(x["snapshots"])=={"apt","pypi","npm","maven","cargo","go","oci"}
          PY

      - name: Search index
        run: |
          mkdir -p /tmp/ark-vault/lock
          printf '{"profile":"nano","artifacts":[{"id":"demo","family":"docs","path":"demo.txt","sha256":"x"}],"containers":[]}' > /tmp/ark-vault/lock/nano.lock.json
          echo 'solar battery water reticulum' > /tmp/ark-vault/demo.txt
          python scripts/build_search_index.py --vault /tmp/ark-vault --repo . --max-text-mb 16
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("/tmp/ark-vault/state/search/ark-search.sqlite")
          assert db.execute("select count(*) from ark_fts").fetchone()[0] > 5
          assert db.execute("select count(*) from ark_fts where ark_fts match 'reticulum'").fetchone()[0] > 0
          PY

      - name: Offline factory and frozen map closure
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,yaml
          root=pathlib.Path("/tmp/factory");root.mkdir(exist_ok=True)
          p=root/"dummy";p.write_text("offline")
          (root/"factory-manifest.json").write_text(json.dumps({"schema":1,"protocol":"ark-offline-factory-v1","files":[{"path":"dummy","bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}]}))
          for profile in ("nano","family","nomad","civilization"):
              d=yaml.safe_load(open(f"profiles/{profile}.yml"))
              ids={x["id"] for x in d["artifacts"]}
              assert {"planetiler-water-polygons","planetiler-natural-earth","planetiler-lake-centerlines"} <= ids
          assert "--download" not in open("scripts/prepare_profile.py").read()
          PY
          python scripts/offline_factory.py verify --factory /tmp/factory
          grep -q "poppler-utils" manifests/appliance-os-packages.yml
          grep -q "tesseract-ocr-spa" manifests/appliance-os-packages.yml

      - name: Universal document formats
        run: |
          rm -rf /tmp/rich-vault
          python - <<'PY'
          import pathlib,zipfile
          v=pathlib.Path("/tmp/rich-vault");(v/"lock").mkdir(parents=True)
          (v/"lock/nano.lock.json").write_text('{"profile":"nano","artifacts":[],"containers":[]}')
          with zipfile.ZipFile(v/"manual.epub","w") as z:
              z.writestr("OPS/ch1.xhtml","<html><body><h1>Manual de agua</h1><p>purificacion solar emergencia</p></body></html>")
          with zipfile.ZipFile(v/"notes.docx","w") as z:
              z.writestr("word/document.xml","<w:document><w:p><w:r><w:t>reticulum field relay</w:t></w:r></w:p></w:document>")
          PY
          python scripts/build_search_index.py --vault /tmp/rich-vault --repo . --max-text-mb 24
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("/tmp/rich-vault/state/search/ark-search.sqlite")
          assert db.execute("select count(*) from ark_fts where ark_fts match 'purificacion'").fetchone()[0] > 0
          assert db.execute("select count(*) from ark_fts where ark_fts match 'relay'").fetchone()[0] > 0
          fm=db.execute("select value from meta where key='universal_formats'").fetchone()[0]
          assert all(x in fm for x in ("pdf","epub","docx","ocr-image"))
          PY

      - name: Trusted release signature and material binding
        run: |
          mkdir -p /tmp/trust/vault/lock
          echo image > /tmp/trust/image.img
          echo '{"profile":"nano"}' > /tmp/trust/vault/lock/nano.lock.json
          echo '{"bomFormat":"CycloneDX"}' > /tmp/trust/vault/lock/nano.cdx.json
          python scripts/release_trust.py keygen --private /tmp/trust/private.pem --public /tmp/trust/public.pem --bits 2048
          python scripts/release_trust.py create --profile nano --image /tmp/trust/image.img --vault /tmp/trust/vault --out /tmp/trust/release.json
          python scripts/release_trust.py sign --file /tmp/trust/release.json --key /tmp/trust/private.pem --signature /tmp/trust/release.sig
          python scripts/release_trust.py verify --file /tmp/trust/release.json --public-key /tmp/trust/public.pem --signature /tmp/trust/release.sig
          python scripts/release_trust.py fingerprint --public-key /tmp/trust/public.pem | grep -E '^[0-9a-f]{64}$'
          python scripts/release_trust.py verify-materials --manifest /tmp/trust/release.json --image /tmp/trust/image.img --lock /tmp/trust/vault/lock/nano.lock.json --bom /tmp/trust/vault/lock/nano.cdx.json

      - name: Signed offline update bundle
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          for name,body in [("base","old"),("new","new")]:
              v=pathlib.Path("/tmp")/name
              shutil.rmtree(v,ignore_errors=True)
              (v/"lock").mkdir(parents=True)
              (v/"data").mkdir()
              p=v/"data/demo.txt"; p.write_text(body)
              rec={"id":"demo","path":"data/demo.txt","sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size}
              (v/"lock/nano.lock.json").write_text(json.dumps({"profile":"nano","artifacts":[rec],"containers":[]}))
              (v/"lock/nano.cdx.json").write_text('{"bomFormat":"CycloneDX"}')
          PY
          python scripts/update_bundle.py create --base-vault /tmp/base --new-vault /tmp/new --profile nano --out /tmp/update.tar
          python scripts/update_bundle.py verify /tmp/update.tar
          python scripts/release_trust.py keygen --private /tmp/update-private.pem --public /tmp/update-public.pem --bits 2048
          python scripts/update_bundle.py sign /tmp/update.tar --key /tmp/update-private.pem --signature /tmp/update.sig
          python scripts/update_bundle.py verify-signed /tmp/update.tar --public-key /tmp/update-public.pem --signature /tmp/update.sig
          cp -a /tmp/base /tmp/target
          python scripts/update_bundle.py apply /tmp/update.tar --target-vault /tmp/target --public-key /tmp/update-public.pem --signature /tmp/update.sig --require-signature
          test "$(cat /tmp/target/data/demo.txt)" = "new"

      - name: Ark-to-Ark content-addressed replication
        run: |
          rm -rf /tmp/mesh && mkdir -p /tmp/mesh/source/lock /tmp/mesh/source/data /tmp/mesh/peer/lock
          python - <<'PY'
          import hashlib,json,pathlib
          s=pathlib.Path("/tmp/mesh/source")
          p=s/"data/demo.txt"; p.write_text("same chunks can save another Ark\n"*4000)
          rec={"id":"demo","family":"test","path":"data/demo.txt","sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size,"required":True}
          (s/"lock/nano.lock.json").write_text(json.dumps({"profile":"nano","artifacts":[rec],"containers":[]}))
          (s/"lock/nano.cdx.json").write_text('{"bomFormat":"CycloneDX"}')
          t=pathlib.Path("/tmp/mesh/peer")
          (t/"lock/nano.lock.json").write_text(json.dumps({"profile":"nano","artifacts":[],"containers":[]}))
          (t/"lock/nano.cdx.json").write_text('{"bomFormat":"CycloneDX"}')
          PY
          python scripts/ark_mesh.py inventory --vault /tmp/mesh/source --profile nano --store /tmp/mesh/source-store --out /tmp/mesh/source.json --chunk-bytes 1048576
          python scripts/ark_mesh.py inventory --vault /tmp/mesh/peer --profile nano --store /tmp/mesh/peer-store --out /tmp/mesh/peer.json --chunk-bytes 1048576
          python scripts/ark_mesh.py pack --source-inventory /tmp/mesh/source.json --target-inventory /tmp/mesh/peer.json --store /tmp/mesh/source-store --out /tmp/mesh/pack.tar
          python scripts/ark_mesh.py verify-pack /tmp/mesh/pack.tar
          python scripts/ark_mesh.py apply-pack /tmp/mesh/pack.tar --store /tmp/mesh/peer-store --inventory-out /tmp/mesh/received.json
          python scripts/ark_mesh.py restore --inventory /tmp/mesh/received.json --store /tmp/mesh/peer-store --target-vault /tmp/mesh/recovered
          cmp /tmp/mesh/source/data/demo.txt /tmp/mesh/recovered/data/demo.txt

      - name: Power and communications policy
        run: |
          cat > /tmp/power-low.json <<'EOF'
          {"battery_present":true,"battery_percent":10,"battery_status":"Discharging","ac_online":false,"ups":{"available":false}}
          EOF
          python scripts/power_policy.py --fixture /tmp/power-low.json --state /tmp/power-state.json --policy conserve --apply
          python - <<'PY'
          import json
          assert json.load(open("/tmp/power-state.json"))["mode"]=="survival"
          PY
          python scripts/field_comms.py check --config config/field-comms.yml
          python scripts/field_comms.py render --config config/field-comms.yml --out /tmp/comms.md
          python scripts/field_comms.py reticulum-config --config config/field-comms.yml --out /tmp/reticulum.conf
          grep -q "Reticulum" /tmp/comms.md
          grep -q "AutoInterface" /tmp/reticulum.conf

      - name: Offline agent scheduler persistence
        run: |
          rm -rf /tmp/scheduler-vault
          mkdir -p /tmp/scheduler-vault
          python scripts/agent_scheduler.py --vault /tmp/scheduler-vault add "Inspect local field readiness" --profile nano --role field --at 4102444800 --every-seconds 3600
          python scripts/agent_scheduler.py --vault /tmp/scheduler-vault list > /tmp/jobs.json
          python - <<'PY'
          import json,sqlite3
          rows=json.load(open("/tmp/jobs.json"))
          assert len(rows)==1 and rows[0]["role"]=="field" and rows[0]["enabled"]==1
          db=sqlite3.connect("/tmp/scheduler-vault/state/agent/scheduler.sqlite")
          assert db.execute("select count(*) from jobs").fetchone()[0]==1
          PY

      - name: Approval-gated evolution
        run: |
          cat > /tmp/scout.json <<'EOF'
          {"schema":1,"candidate_capabilities":[{"repo":"example/offline-tool","family":"offline-core","description":"offline local emergency archive","stars":250,"archived":false,"pushed_at":"2026-09-01T00:00:00Z","license":"Apache-2.0"}]}
          EOF
          python scripts/evolution.py propose --scout /tmp/scout.json --out /tmp/proposal.json --per-family 3
          python scripts/evolution.py validate /tmp/proposal.json
          python scripts/evolution.py agent-prompt /tmp/proposal.json --out /tmp/evolution-review.txt
          python - <<'PY'
          import json,tarfile,pathlib
          p=json.load(open("/tmp/proposal.json"))
          assert p["policy"]=={"execute_candidates":False,"auto_promote":False,"human_approval_required":True}
          assert p["candidates"][0]["trust_state"]=="PROPOSED_UNTRUSTED"
          root=pathlib.Path("/tmp/evolution-archive");root.mkdir(exist_ok=True)
          (root/"LICENSE").write_text("test")
          (root/"README.md").write_text("offline")
          with tarfile.open("/tmp/evolution.tar","w") as tf:
              tf.add(root/"LICENSE",arcname="pkg/LICENSE")
              tf.add(root/"README.md",arcname="pkg/README.md")
          PY
          python scripts/evolution.py inspect-archive /tmp/evolution.tar --out /tmp/inspection.json
          grep -q '"executed": false' /tmp/inspection.json

      - name: Cold generations and rollback metadata
        run: |
          rm -rf /tmp/generations /tmp/cold-restore /tmp/cold-store
          python scripts/ark_generations.py create --inventory /tmp/mesh/source.json --root /tmp/generations --label ci
          GEN="$(find /tmp/generations -mindepth 1 -maxdepth 1 -type d | head -1)"
          python scripts/ark_generations.py cold-export --generation "$GEN" --store /tmp/mesh/source-store --out /tmp/cold.tar
          python scripts/ark_generations.py cold-verify /tmp/cold.tar
          python scripts/ark_generations.py restore /tmp/cold.tar --store /tmp/cold-store --target-vault /tmp/cold-restore
          cmp /tmp/mesh/source/data/demo.txt /tmp/cold-restore/data/demo.txt
          python scripts/ark_generations.py activate --generation "$GEN" --state-root /tmp/generation-state

      - name: Receive-only field radio plan
        run: |
          rm -rf /tmp/radio-vault && mkdir -p /tmp/radio-vault/source/radio /tmp/radio-vault/firmware/meshtastic
          python scripts/field_radio.py --vault /tmp/radio-vault inventory > /tmp/radio.json
          python scripts/field_radio.py --vault /tmp/radio-vault plan --out /tmp/radio-plan.md
          grep -q '"receive_only": true' /tmp/radio.json
          grep -q "never transmits" /tmp/radio-plan.md
          grep -q "rtl-sdr" manifests/appliance-os-packages.yml

      - name: Physical evidence campaign semantics
        run: |
          mkdir -p /tmp/reports
          cat > /tmp/field-fixture.json <<'EOF'
          {"profile":"nano","hardware":{"system_vendor":"CI","product_name":"fixture","board_name":"A","bios_vendor":"fixture","bios_version":"1","boot_mode":"UEFI","cpu":"fixture CPU","memory_bytes":8589934592,"disks":[],"gpus":[],"wifi_ap_capable":true},"runtime":{"boot_id":"ci-fixture","kernel":"fixture"},"checks":{"portal":true,"kiwix":true,"ai":true,"voice":true,"wan_reachable":false}}
          EOF
          cat > /tmp/field-fixture-2.json <<'EOF'
          {"profile":"nano","hardware":{"system_vendor":"CI2","product_name":"fixture2","board_name":"B","bios_vendor":"fixture","bios_version":"2","boot_mode":"BIOS","cpu":"fixture CPU 2","memory_bytes":8589934592,"disks":[],"gpus":[],"wifi_ap_capable":true},"runtime":{"boot_id":"ci-fixture-2","kernel":"fixture"},"checks":{"portal":true,"kiwix":true,"ai":true,"voice":true,"wan_reachable":false}}
          EOF
          python scripts/field_drill.py --fixture /tmp/field-fixture.json --profile nano --expect-offline --cold-boot-asserted --require-cold-boot --out /tmp/reports/ci.json
          python scripts/field_drill.py --fixture /tmp/field-fixture-2.json --profile nano --expect-offline --cold-boot-asserted --require-cold-boot --out /tmp/reports/ci2.json
          python scripts/field_campaign.py --reports /tmp/reports --min-hardware 2 --require-bios-and-uefi --out /tmp/campaign.json
          grep -q '"field_proven": true' /tmp/campaign.json
