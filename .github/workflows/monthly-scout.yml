name: Monthly capability scout

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Verify required NANO sources still resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/acquire.py plan --profile profiles/nano.yml --vault vault/nano

      - name: Discover upstream changes and candidate capabilities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scout.py

      - name: Convert discovery into an untrusted evolution proposal
        run: |
          python scripts/evolution.py propose --scout reports/scout-latest.json --out reports/evolution-latest.json --per-family 3
          python scripts/evolution.py validate reports/evolution-latest.json
          python scripts/evolution.py agent-prompt reports/evolution-latest.json --out reports/evolution-agent-review.txt

      - name: Publish discovery report as review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- reports/ && [ -z "$(git status --porcelain reports/)" ]; then
            echo "No report changes."
            exit 0
          fi

          BRANCH="bot/scout-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"

          git config user.name "endworld-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add reports/
          git commit -m "Scout ENDWORLD capabilities $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "ENDWORLD capability scout $(date -u +%Y-%m-%d)" \
            --body "Discovery + untrusted evolution proposal only. No candidate has been downloaded into the vault, executed, trusted, or promoted. Promotion still requires static quarantine evidence, local Ark analysis, explicit human approval, normal manifest review and CI."
