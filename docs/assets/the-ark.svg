<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">THE ARK product family</title>
<desc id="desc">A layered ark illustrating NANO, FAMILY, NOMAD, CIVILIZATION and ARK with increasing capability density.</desc>
<defs>
  <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#68b7ee"/><stop offset="1" stop-color="#dff4ff"/></linearGradient>
  <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#1479a8"/><stop offset="1" stop-color="#064663"/></linearGradient>
  <linearGradient id="wood" x1="0" x2="1"><stop stop-color="#6e3e1f"/><stop offset=".5" stop-color="#a96732"/><stop offset="1" stop-color="#5d331d"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".22"/></filter>
</defs>
<rect width="1600" height="610" fill="url(#sky)"/>
<rect y="610" width="1600" height="290" fill="url(#sea)"/>
<circle cx="1400" cy="125" r="70" fill="#fff4a8" opacity=".85"/>
<g fill="#fff" opacity=".7"><ellipse cx="260" cy="130" rx="150" ry="45"/><ellipse cx="430" cy="105" rx="110" ry="35"/><ellipse cx="1150" cy="170" rx="125" ry="35"/></g>
