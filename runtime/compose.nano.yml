services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    restart: unless-stopped
    command: ["*.zim"]
    volumes:
      - ../vault/nano/knowledge/zim:/data:ro
    ports:
      - "8081:8080"

  ai:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - "-m"
      - "/models/Qwen3-4B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "4096"
    volumes:
      - ../vault/nano/ai/models:/models:ro
    ports:
      - "8082:8080"
